<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-label="Image unavailable">
  <!--
    The old fallback pointed at an Unsplash photo that has since been taken
    down, so every product without a picture rendered a broken-image icon and
    the onError handler swapped it for a second URL that 404s just as hard.
    This ships with the site: it cannot go missing, costs one cached request,
    and needs no third-party origin.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e9eef5"/>
    </linearGradient>
  </defs>
  <rect width="400" height="320" fill="url(#g)"/>
  <g fill="none" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="140" y="112" width="120" height="96" rx="10"/>
    <path d="M140 178l30-28 24 22 26-30 40 38"/>
  </g>
  <circle cx="176" cy="140" r="9" fill="#cbd5e1"/>
  <text x="200" y="242" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="15" font-weight="600" fill="#94a3b8">Image coming soon</text>
</svg>
