<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      These were a 900 KB PNG and a 1.2 MB SVG (the same PNG again, base64'd
      inside an <image> tag) — 2 MB of full-resolution logo downloaded on every
      page load to paint a 16 px tab icon, dwarfing the entire JS bundle. Same
      artwork, rendered at the sizes it is actually displayed at. The 1254 px
      original is still in the repo root if it is ever needed again.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png" />
    <meta name="theme-color" content="#0f172a" />

    <!--
      Baseline head.

      `npm run build` runs scripts/prerender.js afterwards, which replaces the
      title, description and canonical below with the real ones for each route
      and appends that route's Open Graph tags and schema.org graph. What is
      left here is what the dev server serves, and what any route that could not
      be prerendered falls back to — so it still has to be correct, just generic.
    -->
    <meta
      name="description"
      content="Nazir & Sons — premium paper, fine arts materials and stationery. Direct importers serving Pakistan's printing industry since 1993."
    />
    <link rel="canonical" href="https://www.nazirandsons.shop/" />
    <meta
      name="robots"
      content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"
    />
    <meta property="og:site_name" content="Nazir &amp; Sons" />
    <meta property="og:locale" content="en_PK" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.nazirandsons.shop/" />
    <meta property="og:image" content="https://www.nazirandsons.shop/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="geo.region" content="PK-PB" />
    <meta name="geo.placename" content="Lahore" />

    <!-- Warm up the origins the first paint depends on, before the JS bundle asks for them. -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <!-- Nearly all catalogue photography lives here. -->
    <link rel="preconnect" href="https://cdn.shopify.com" crossorigin />
    <link rel="dns-prefetch" href="https://i.postimg.cc" />
    <!-- Only the Paper & Canvas artwork still comes from here. -->
    <link rel="dns-prefetch" href="https://images.unsplash.com" />

    <!--
      Fonts are self-hosted (see src/fonts.css), so there is no third-party CSS
      round trip standing between the HTML and the first correctly-typeset frame.
      These two carry everything visible above the fold — the Playfair wordmark
      and the Jakarta UI — so they are fetched in parallel with the JS bundle
      rather than after it. Inter (body copy) loads normally; its metric-matched
      fallback holds the layout in the meantime.
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/playfair-latin.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/jakarta-latin.woff2"
      crossorigin
    />

    <title>Nazir & Sons — Premium Paper, Fine Arts & Stationery</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
