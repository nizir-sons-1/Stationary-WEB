<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="2snhzm-YxreatXbDKkbs9i5bbyzqqIunNIGUF5VzghE" />
    <!--
      These were a 900 KB PNG and a 1.2 MB SVG (the same PNG again, base64'd
      inside an <image> tag) — 2 MB of full-resolution logo downloaded on every
      page load to paint a 16 px tab icon, dwarfing the entire JS bundle. Same
      artwork, rendered at the sizes it is actually displayed at. The 1254 px
      original is still in the repo root if it is ever needed again.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png" />
    <meta name="theme-color" content="#0f172a" />

    <!--
      Baseline head.

      `npm run build` runs scripts/prerender.js afterwards, which replaces the
      title, description and canonical below with the real ones for each route
      and appends that route's Open Graph tags and schema.org graph. What is
      left here is what the dev server serves, and what any route that could not
      be prerendered falls back to — so it still has to be correct, just generic.
    -->
    <meta
      name="description"
      content="Nazir & Sons — premium paper, fine arts materials and stationery. Direct importers serving Pakistan's printing industry since 1993."
    />
    <meta name="keywords" content="Nazir and Sons, nazirandsons, Nazir & Sons, papers wholesale, wholesale paper, stationery, paper market lahore, stationery wholesale lahore" />
    <link rel="canonical" href="https://www.nazirandsons.shop/" />
    <meta
      name="robots"
      content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"
    />
    <meta property="og:site_name" content="Nazir &amp; Sons" />
    <meta property="og:locale" content="en_PK" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.nazirandsons.shop/" />
    <meta property="og:image" content="https://www.nazirandsons.shop/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="geo.region" content="PK-PB" />
    <meta name="geo.placename" content="Lahore" />
    <meta name="geo.position" content="31.5615;74.3230" />
    <meta name="ICBM" content="31.5615, 74.3230" />
    <meta name="author" content="Nazir & Sons" />
    <link rel="alternate" hreflang="en-PK" href="https://www.nazirandsons.shop/" />
    <link rel="alternate" hreflang="x-default" href="https://www.nazirandsons.shop/" />

    <!-- Warm up the origins the first paint depends on, before the JS bundle asks for them. -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <!-- Nearly all catalogue photography lives here. -->
    <link rel="preconnect" href="https://cdn.shopify.com" crossorigin />
    <link rel="dns-prefetch" href="https://i.postimg.cc" />
    <!-- Only the Paper & Canvas artwork still comes from here. -->
    <link rel="dns-prefetch" href="https://images.unsplash.com" />

    <!--
      Fonts are self-hosted (see src/fonts.css), so there is no third-party CSS
      round trip standing between the HTML and the first correctly-typeset frame.
      These two carry everything visible above the fold — the Playfair wordmark
      and the Jakarta UI — so they are fetched in parallel with the JS bundle
      rather than after it. Inter (body copy) loads normally; its metric-matched
      fallback holds the layout in the meantime.
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/playfair-latin.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/jakarta-latin.woff2"
      crossorigin
    />

    <!-- Preload LCP hero image so browser discovers it immediately before JS downloads/mounts -->
    <link
      rel="preload"
      as="image"
      href="/images/hero-banner.webp"
      type="image/webp"
      fetchpriority="high"
    />

    <title>Nazir & Sons — Premium Paper, Fine Arts & Stationery</title>
    <style id="critical-css">
      /* Critical Above-The-Fold Styles */
      *, ::before, ::after { box-sizing: border-box; border-width: 0; border-style: solid; border-color: #e5e7eb; }
      html {
        line-height: 1.5;
        -webkit-text-size-adjust: 100%;
        tab-size: 4;
        font-family: "Plus Jakarta Sans", "Jakarta Fallback", system-ui, -apple-system, sans-serif;
      }
      body {
        margin: 0;
        line-height: inherit;
        background-color: #f4f4f5;
        color: #0f172a;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .flex { display: flex; }
      .flex-col { flex-direction: column; }
      .flex-grow { flex-grow: 1; }
      .min-h-screen { min-height: 100vh; }
      .relative { position: relative; }
      .absolute { position: absolute; }
      .inset-0 { inset: 0; }
      .w-full { width: 100%; }
      .h-full { height: 100%; }
      .items-center { align-items: center; }
      .justify-between { justify-content: space-between; }

      /* Fixed Nav Shell */
      header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 50;
        width: 100%;
      }
      main {
        flex-grow: 1;
        padding-top: 64px;
      }
      @media (min-width: 768px) {
        main { padding-top: 68px; }
      }

      /* Hero Section Above-The-Fold */
      #hero-section {
        position: relative;
        width: 100%;
        margin-top: -64px;
        padding-top: 64px;
        min-height: 500px;
        display: flex;
        align-items: center;
        overflow: hidden;
        background-color: #f5f2eb;
      }
      @media (min-width: 640px) {
        #hero-section { min-height: 560px; }
      }
      @media (min-width: 768px) {
        #hero-section {
          margin-top: -68px;
          padding-top: 68px;
          min-height: 600px;
        }
      }
      @media (min-width: 1024px) {
        #hero-section { min-height: 640px; }
      }
      #hero-section picture,
      #hero-section img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #hero-section h1 {
        font-family: "Playfair Display", "Playfair Fallback", Georgia, serif;
        font-size: 34px;
        font-weight: 400;
        color: #112338;
        line-height: 1.1;
        letter-spacing: -0.02em;
        margin: 0 0 14px;
      }
      @media (min-width: 640px) {
        #hero-section h1 { font-size: 40px; }
      }
      @media (min-width: 768px) {
        #hero-section h1 { font-size: 46px; }
      }
      @media (min-width: 1024px) {
        #hero-section h1 { font-size: 50px; }
      }

      /* FOUC & Prerender control */
      html.js-enabled #prerender { display: none; }
      html.js-enabled body { background-color: #f4f4f5; }
    </style>
    <script>document.documentElement.className += ' js-enabled';</script>

    <!-- Google tag (gtag.js) deferred to idle/load to avoid blocking initial paint and network streams -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-BVW49H11EZ');

      function loadAnalytics() {
        if (window.__gtagLoaded) return;
        window.__gtagLoaded = true;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-BVW49H11EZ';
        document.head.appendChild(s);
      }
      if ('requestIdleCallback' in window) {
        window.addEventListener('load', function() {
          requestIdleCallback(loadAnalytics, { timeout: 3000 });
        });
      } else {
        window.addEventListener('load', loadAnalytics);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
